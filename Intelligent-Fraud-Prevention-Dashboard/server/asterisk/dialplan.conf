; ============================================================================
; Asterisk Dialplan Configuration for Fraud Verification IVR
; ============================================================================
;
; Context: fraud-verification
; Purpose: Receives outbound calls originated by the Node.js ARI client,
;          plays a verification prompt, collects 6-digit DTMF input,
;          and validates via AGI callback to the Node backend.
;
; Prerequisites:
;   1. Asterisk 20+ with PJSIP
;   2. ARI enabled (see /etc/asterisk/ari.conf)
;   3. HTTP server enabled (see /etc/asterisk/http.conf)
;   4. Custom audio prompts in /var/lib/asterisk/sounds/custom/
;   5. AGI connection to Node.js backend on port 4573
;
; Copy this file to /etc/asterisk/extensions.conf (or include it).
; ============================================================================

[fraud-verification]
; Inbound from ARI originate — the appArgs contain the verification code
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Set(EXPECTED_CODE=${ARG1})
 same => n,Playback(custom/fraud-verify-prompt)
 same => n,SayAlpha(${EXPECTED_CODE})
 same => n,Playback(custom/fraud-verify-enter-code)
 same => n,Read(DTMF_CODE,,6,,,15)
 same => n,GotoIf($["${DTMF_CODE}" = ""]?timeout)
 same => n,AGI(agi://localhost:4573/verify,${DTMF_CODE},${EXPECTED_CODE})
 same => n,GotoIf($["${VERIFY_RESULT}" = "success"]?verified:failed)
 same => n(verified),Playback(custom/verification-success)
 same => n,Hangup()
 same => n(failed),Playback(custom/verification-failed)
 same => n,Playback(custom/fraud-verify-enter-code)
 same => n,Read(DTMF_CODE,,6,,,15)
 same => n,GotoIf($["${DTMF_CODE}" = ""]?timeout)
 same => n,AGI(agi://localhost:4573/verify,${DTMF_CODE},${EXPECTED_CODE})
 same => n,GotoIf($["${VERIFY_RESULT}" = "success"]?verified2:final_fail)
 same => n(verified2),Playback(custom/verification-success)
 same => n,Hangup()
 same => n(final_fail),Playback(custom/verification-max-attempts)
 same => n,Hangup()
 same => n(timeout),Playback(custom/verification-timeout)
 same => n,Hangup()

; ============================================================================
; Stasis application handler (alternative to AGI approach)
; When using ARI Stasis mode, the Node.js backend handles events directly
; via WebSocket. No AGI needed — DTMF events fire as JSON.
;
; [fraud-verification-stasis]
; exten => _X.,1,Stasis(fraud-verification,${ARG1})
;  same => n,Hangup()
; ============================================================================
