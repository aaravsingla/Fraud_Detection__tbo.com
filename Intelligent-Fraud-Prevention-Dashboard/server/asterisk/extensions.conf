; ============================================================================
; Asterisk PJSIP Configuration — Twilio Elastic SIP Trunking
; ============================================================================
;
; This file defines the PJSIP endpoint for outbound verification calls
; routed through Twilio Elastic SIP Trunking.
;
; Copy to /etc/asterisk/pjsip.conf (or #include from it).
;
; Before using:
;   1. Create a Twilio Elastic SIP Trunk at https://console.twilio.com
;   2. Set the Origination URI to: sip:<your-asterisk-public-ip>:5060
;   3. Under "Termination", note your Termination SIP URI
;      (e.g. your-trunk-name.pstn.twilio.com)
;   4. Enable Credential List auth OR IP Access Control List auth
;   5. Replace placeholder values below with your Twilio details
; ============================================================================

; ── PJSIP Transport ──────────────────────────────────────────────────────────
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ── Twilio SIP Trunk Endpoint ────────────────────────────────────────────────
[twilio-trunk]
type = endpoint
transport = transport-udp
context = fraud-verification
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
outbound_auth = twilio-auth
aors = twilio-aor
; Caller ID — set to your Twilio number (E.164 format)
from_user = +1XXXXXXXXXX
from_domain = your-trunk-name.pstn.twilio.com

[twilio-auth]
type = auth
auth_type = userpass
; Twilio Credential List username & password
; (create under Elastic SIP Trunking → Credential Lists in Twilio Console)
username = your_twilio_credential_username
password = your_twilio_credential_password

[twilio-aor]
type = aor
contact = sip:your-trunk-name.pstn.twilio.com:5060

; ── Identify Twilio for inbound calls (optional, for two-way calling) ────────
[twilio-identify]
type = identify
endpoint = twilio-trunk
; Twilio's SIP signaling IP ranges — see https://www.twilio.com/docs/sip-trunking/ip-addresses
match = 54.172.60.0/30
match = 54.244.51.0/30
match = 54.171.127.192/30
match = 35.156.191.128/30
match = 54.65.63.192/30
match = 54.169.127.128/30
match = 54.252.254.64/30
match = 177.71.206.192/30

; ── Outbound Dial Pattern ────────────────────────────────────────────────────
; Route calls matching +91XXXXXXXXXX (India) to the Twilio trunk
[outbound-routes]
exten => _+91XXXXXXXXXX,1,Dial(PJSIP/${EXTEN}@twilio-trunk,30)
 same => n,Hangup()

; International fallback (any E.164 number)
exten => _+X.,1,Dial(PJSIP/${EXTEN}@twilio-trunk,30)
 same => n,Hangup()
